  <style>
    /* Minimal extra styles for 404 page – no sidebar adjustments */
    .error-container {
      max-width: 600px;
      margin: 4rem auto;
      text-align: center;
      padding: 2rem 1rem;
    }
    .error-icon {
      font-size: 6rem;

    .error-code {
      font-family: var(--font-mono);
      font-size: 1.2rem;
      background: var(--pillar-color-light);
      display: inline-block;
      padding: 0.2rem 0.8rem;
      border-radius: 30px;
      color: var(--pillar-color);
      margin-bottom: 1rem;
    }
    .error-message {
      font-size: 1.2rem;
      margin-bottom: 2rem;
    }
    .error-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
      margin: 2rem 0;
    }
    .error-search {
      max-width: 400px;
      margin: 2rem auto;
    }
    /* Remove sidebar margins for main content */
    body .app-shell {
      display: block;
    }
    .main-content {
      margin-left: 0;
    }
    .topbar {
      position: relative;
    }
  </style>
</head>
<body>

<div class="app-shell">
  <!-- Top bar (without hamburger because no sidebar) -->
  <header class="topbar">

        <svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd"/></svg>

    <div class="topbar-right">

        </button>
        <button class="theme-toggle-btn" id="darkBtn" aria-label="Dark mode" title="Dark mode">

        </button>
      </div>
    </div>
  </header>

  <main class="error-container">
    <div class="error-icon">🔍</div>
    <div class="error-code">404</div>
    <h1>Page not found</h1>
    <p class="error-message">The page you're looking for doesn't exist or has been moved.</p>

    <div class="error-actions">
      <a href="index.html" class="btn btn-primary">← Back to Home</a>
      <a href="html/networking.html" class="btn btn-secondary">Networking Pillar</a>

            <div class="cta-sub">Report issues or explore the source</div>
          </div>
        </div>
      </div>
      <div class="github-cta-buttons" style="flex-direction: row;">
        <a href="https://github.com/K-Mash24/DevOps-Journey" target="_blank" rel="noopener" class="btn-github">GitHub Repository</a>
      </div>
    </div>
  </main>
</div>

<script>
  // Custom search for 404 page – redirects to home page with search query
  document.addEventListener('DOMContentLoaded', function() {
    const searchInput = document.getElementById('searchInput');
    if (searchInput) {
      // Handle Enter key – redirect to home page with search param
      searchInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
          const query = this.value.trim();
          if (query) {
            window.location.href = `index.html?search=${encodeURIComponent(query)}`;
          }
        }
      });
      
      // Handle / shortcut to focus search
      window.addEventListener('keydown', function(e) {
        if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
          e.preventDefault();
          searchInput.focus();
        }
      });
    }
  });
</script>

<script src="js/global.js"></script>
</body>
</html>
